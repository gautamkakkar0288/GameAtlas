<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5" />

    <title>GameAtlas — The Cinematic Gaming OS</title>
    <meta name="description" content="GameAtlas is your cinematic gaming operating system. Track your library, discover new games powered by IGDB, compete on leaderboards, and connect with the gaming community." />
    <meta name="keywords" content="gaming, game library, game tracker, IGDB, discover games, game reviews, leaderboards, gaming community, arcade" />
    <meta name="author" content="GameAtlas" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#8B0000" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GameAtlas" />
    <meta property="og:title" content="GameAtlas — The Cinematic Gaming OS" />
    <meta property="og:description" content="Your cinematic gaming OS — track your library, discover new games, compete on leaderboards, and connect with the community." />
    <meta property="og:image" content="/opengraph.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GameAtlas — The Cinematic Gaming OS" />
    <meta name="twitter:description" content="Your cinematic gaming OS — track your library, discover new games, compete on leaderboards, and connect with the community." />
    <meta name="twitter:image" content="/opengraph.jpg" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GameAtlas" />
    <meta name="application-name" content="GameAtlas" />
    <meta name="msapplication-TileColor" content="#8B0000" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Fonts: preconnect for performance, then load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Preload IGDB image CDN -->
    <link rel="dns-prefetch" href="https://images.igdb.com" />
    <link rel="dns-prefetch" href="https://img.youtube.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
