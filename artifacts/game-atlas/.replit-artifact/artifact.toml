kind = "web"
previewPath = "/"
title = "GameAtlas"
version = "1.0.0"
id = "artifacts/game-atlas"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23477

[services.development]
run = "pnpm --filter @workspace/game-atlas run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/game-atlas", "run", "build" ]
publicDir = "artifacts/game-atlas/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23477"
BASE_PATH = "/"
